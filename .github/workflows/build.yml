name: Build PSP EBOOT
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build
      - run: cmake --build build
      - uses: actions/upload-artifact@v4
        with:
          name: MK-PSP-EBOOT
          path: build/EBOOT.PBP
